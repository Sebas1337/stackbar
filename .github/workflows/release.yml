name: Release

# Pushing a tag vX.Y.Z (matching the VERSION file) builds Stackbar.app on macOS, signs it with the
# "Stackbar Release" certificate and publishes a GitHub Release with the DMG (to install), the zip
# (for the in-app updater) and the CHANGELOG section as notes. See docs/RELEASING.md.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    runs-on: macos-26
    # The signing secrets live in this environment, which only v* tags may use (docs/RELEASING.md,
    # Signing): a workflow changed on a branch can't read them. A v* tag pushed on such a commit
    # still could (the workflow comes from the tagged commit, so it can drop the main check too).
    environment: release
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # build number = commit count

      - name: Check tag matches VERSION
        run: |
          tag="${GITHUB_REF_NAME#v}"
          file="$(tr -d '[:space:]' < VERSION)"
          if [ "$tag" != "$file" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION ($file)"
            exit 1
          fi
          echo "VERSION=$tag" >> "$GITHUB_ENV"

      # Only commits on main are released (RELEASING.md tags the merge commit).
      - name: Check the tag is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main"
            exit 1
          fi

      - name: Release notes
        run: scripts/changelog-notes.sh "$VERSION" > "$RUNNER_TEMP/notes.md"

      - name: Test
        run: swift test

      # The certificate from scripts/make-release-cert.sh, in a keychain of its own, trusted for
      # code signing so `security find-identity -v` lists it (build-app.sh signs by its hash).
      - name: Signing identity
        env:
          RELEASE_CERT_P12: ${{ secrets.RELEASE_CERT_P12 }}
          RELEASE_CERT_PASSWORD: ${{ secrets.RELEASE_CERT_PASSWORD }}
        run: |
          if [ -z "$RELEASE_CERT_P12" ] || [ -z "$RELEASE_CERT_PASSWORD" ]; then
            echo "::error::Secrets RELEASE_CERT_P12 / RELEASE_CERT_PASSWORD are missing (docs/RELEASING.md, Signing)"
            exit 1
          fi
          keychain="$RUNNER_TEMP/release.keychain-db"
          keychain_password="$(openssl rand -hex 16)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          # Pasted secrets can carry a trailing newline (`pbcopy < password.txt` did, 1.1.1 release):
          # the import then fails with "MAC verification failed". Neither value contains whitespace.
          password="$(printf '%s' "$RELEASE_CERT_PASSWORD" | tr -d '[:space:]')"
          printf '%s' "$RELEASE_CERT_P12" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/release.p12"
          security import "$RUNNER_TEMP/release.p12" -k "$keychain" -P "$password" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/release.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          security find-certificate -c "Stackbar Release" -p "$keychain" > "$RUNNER_TEMP/release.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/release.pem"
          security find-identity -v -p codesigning "$keychain"

      - name: Build Stackbar.app
        # Universal: macOS 26 still runs on some Intel Macs.
        run: make app ARCHS="arm64 x86_64" SIGN_IDENTITY="Stackbar Release" REQUIRE_IDENTITY=1

      - name: Check signature
        run: |
          codesign --verify --strict --deep build/Stackbar.app
          # Not grep -q: codesign could die of SIGPIPE once grep quits, failing the step (pipefail).
          codesign -dvv build/Stackbar.app 2>&1 | grep '^Authority=Stackbar Release$' > /dev/null
          codesign -d -r- build/Stackbar.app

      - name: Package
        run: |
          # The script, not `make dmg`: that would rebuild the app for the runner's architecture only.
          REQUIRE_LAYOUT=1 scripts/make-dmg.sh
          ditto -c -k --keepParent build/Stackbar.app "dist/Stackbar-$VERSION.zip"
          cd dist
          for file in "Stackbar-$VERSION.dmg" "Stackbar-$VERSION.zip"; do
            shasum -a 256 "$file" > "$file.sha256"
          done

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          [[ "$VERSION" == *-* ]] && prerelease=(--prerelease)
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Stackbar $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --verify-tag "${prerelease[@]}"
